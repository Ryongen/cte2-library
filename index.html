<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTE2 Library</title>
<meta name="description" content="Browse every affix, unique, rune, spell and support gem in the Craft to Exile 2 modpack, at any character level.">
<link rel="icon" href="assets/icons/group/unique_gear.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <h1>CTE2 <span>Library</span></h1>

  <label class="ctl">
    <span data-t="version">Version</span>
    <select id="version"></select>
  </label>

  <label class="ctl" id="lang-ctl" hidden data-t-title="langTip"
         title="The mod's own translations. The pack adds its content in English only, so most skills and uniques stay English in every language.">
    <span data-t="language">Language</span>
    <select id="lang"></select>
  </label>

  <label class="ctl">
    <span data-t="level">Level</span>
    <input id="level" type="number" min="1" max="100" value="1" inputmode="numeric">
  </label>

  <label class="ctl" id="skill-ctl" hidden data-t-title="skillTip"
         title="A skill gem's own rank, separate from your character level. Leave it empty for the skill's natural maximum; gear can push it past that.">
    <span data-t="skillLvl">Skill Lvl</span>
    <input id="skill-level" type="number" min="0" placeholder="max" inputmode="numeric">
  </label>

  <label class="ctl grow">
    <span data-t="search">Search</span>
    <input id="search" type="search" data-t-ph="searchPh" placeholder="Name or id&hellip;" autocomplete="off">
  </label>

  <label class="ctl check">
    <input id="search-tips" type="checkbox">
    <span data-t="searchTips">Search tooltips</span>
  </label>
</header>

<main>
  <nav id="rail" data-t-aria="categories" aria-label="Categories"></nav>

  <section class="mid">
    <div class="bar">
      <label class="filter" id="rarity" hidden></label>
      <div id="filters"></div>
      <span id="count" class="count"></span>
    </div>
    <div id="list" class="list"></div>
  </section>

  <aside id="tip" class="tip"></aside>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
